name: Good CI/CD (Python)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./lab4-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build check
        run: python -c "print('Build OK')"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: lab4-source
          path: lab4-ci-cd/

  test:
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./lab4-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./lab4-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 .

  security:
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./lab4-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Security audit
        run: bandit -r .
    continue-on-error: true

  deploy:
    runs-on: ubuntu-22.04
    needs: [test, lint, security]
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy
        run: echo "Deploying to production..."